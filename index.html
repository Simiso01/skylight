<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skylight</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Live weather</p>
      <h1>Skylight</h1>
    </div>
    <form id="search-form" class="search" role="search">
      <label class="sr" for="city">City</label>
      <input id="city" name="city" type="search" placeholder="Search a city" autocomplete="off">
      <button type="submit">Search</button>
      <button id="locate" type="button" class="ghost">My location</button>
    </form>
  </header>

  <form id="key-form" class="key">
    <label for="api-key">OpenWeather API key</label>
    <input id="api-key" type="password" autocomplete="off" placeholder="Paste your free key" spellcheck="false">
    <button type="submit">Save key</button>
  </form>
  <p class="hint">Station observations from <a href="https://openweathermap.org/api" target="_blank" rel="noopener">OpenWeatherMap</a>. <a href="https://home.openweathermap.org/api_keys" target="_blank" rel="noopener">Create a free key</a>. A new key can take up to two hours to activate.</p>

  <p id="status" class="status" role="status"></p>
  <ul id="suggestions" class="suggestions" hidden></ul>

  <main id="report" class="report" hidden>
    <section class="now">
      <div>
        <p id="place" class="place"></p>
        <p id="condition" class="condition"></p>
        <p class="temp"><span id="temperature">–</span><span class="unit">°C</span></p>
        <p id="updated" class="updated"></p>
      </div>
      <dl class="facts">
        <div><dt>Feels like</dt><dd id="feels">–</dd></div>
        <div><dt>Humidity</dt><dd id="humidity">–</dd></div>
        <div><dt>Wind</dt><dd id="wind">–</dd></div>
        <div><dt>Rain</dt><dd id="rain">–</dd></div>
      </dl>
    </section>

    <section>
      <h2>Next 24 hours</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section>
      <h2>This week</h2>
      <ul id="daily" class="daily"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
